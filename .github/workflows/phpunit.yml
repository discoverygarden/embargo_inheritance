---
name: PHPUnit Tests
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  PHPUnit:
    uses: discoverygarden/phpunit-action/.github/workflows/phpunit.yml@v1
    secrets: inherit
    with:
      composer_patches: |
        {
          "drupal/core": {
            "https://www.drupal.org/project/drupal/issues/2920527": "https://www.drupal.org/files/issues/2024-01-24/2920527-37.patch"
          }
        }
